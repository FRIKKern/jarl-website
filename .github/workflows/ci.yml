name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Design gate — contrast (WCAG AA)
        run: pnpm check:contrast

      - name: Design gate — tokens only
        run: pnpm check:tokens

      # Build fetches content from the Barkpark instance. The read-only
      # token comes from the BARKPARK_READ_TOKEN repo secret; before the
      # secret is set the build still passes, with empty content and a
      # loud warning from src/content/client.ts.
      - name: Build
        env:
          BARKPARK_URL: https://jarl.barkpark.cloud
          BARKPARK_READ_TOKEN: ${{ secrets.BARKPARK_READ_TOKEN }}
        run: pnpm build
