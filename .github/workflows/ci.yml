name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Design gate — contrast (WCAG AA)
        run: pnpm check:contrast

      - name: Design gate — tokens only
        run: pnpm check:tokens

      - name: Design gate — a painted surface pins its ink
        run: pnpm check:hover

      # Walks LIVE content: every figure datum (statBand/duel/lineage
      # sections, paper stat blocks) must carry a pattern-valid source ref.
      # The env is REQUIRED here — without the token the script exits 2 by
      # design, because an unauthenticated query answers 200 with zero
      # documents and the gate would be green forever while checking nothing.
      - name: Evidence gate — every figure datum has a source
        env:
          BARKPARK_URL: https://jarl.barkpark.cloud
          BARKPARK_READ_TOKEN: ${{ secrets.BARKPARK_READ_TOKEN }}
        run: pnpm check:sources

      # Renders the LIVE paper corpus with the vendored emitter and asserts
      # every top-level block root stands on one of the doctrine's two
      # widths: the `> *` measure default, or the --figure allowlist parsed
      # out of globals.css itself. An engine block type the gate has never
      # seen fails the build until it is triaged prose-or-figure. Public
      # reads need no token; it is attached when present, same as the build.
      - name: Design gate — the reading-measure doctrine holds
        env:
          BARKPARK_URL: https://jarl.barkpark.cloud
          BARKPARK_READ_TOKEN: ${{ secrets.BARKPARK_READ_TOKEN }}
        run: pnpm check:measure

      # 23 exact sentences over 14 slugs, plus one negative row. They state
      # who led a project, who was second, and whose commits those were —
      # the claims an agent rewriting for rhythm would round off without
      # noticing it had lied about a colleague. Reads the CMS ANONYMOUSLY
      # and on purpose: jarl.no serves x-nextjs-cache: STALE even against a
      # cache-busted URL, so the rendered page cannot be the judge. The live
      # page is polled as a second witness that can only warn.
      - name: Fabrication fence — the immovables have not moved
        env:
          BARKPARK_URL: https://jarl.barkpark.cloud
        run: pnpm check:immovables

      # Every picture claims to be a capture of a real thing at a real time.
      # The caption is the only place that claim is testable, so it must
      # carry a Norwegian date and an origin token. Not a `^Kilde:` grep:
      # only 12 of 45 captions open that way and the other 33 are honest.
      - name: Kilde-loven — every wired caption dates and sources its picture
        env:
          BARKPARK_URL: https://jarl.barkpark.cloud
        run: pnpm check:image-kilde

      - name: Vendored canonical renderer smoke
        run: node --test test/vendored-renderer.test.mjs

      # Build fetches content from the Barkpark instance. Published reads
      # are public, so the build works without the token; the token secret
      # is attached when present for a future private instance. BUILD
      # HONESTY (src/content/client.ts): any API failure FAILS the build —
      # a green build can never prerender an empty site.
      - name: Build
        env:
          BARKPARK_URL: https://jarl.barkpark.cloud
          BARKPARK_READ_TOKEN: ${{ secrets.BARKPARK_READ_TOKEN }}
        run: pnpm build
